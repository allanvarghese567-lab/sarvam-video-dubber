name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & smoke test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Ruff (lint only)
        run: ruff check video_dubber.py

      - name: Syntax compile
        run: python -m py_compile video_dubber.py

      - name: Import smoke test
        run: python -c "import video_dubber; print('import ok')"

      - name: CLI --help
        run: python video_dubber.py --help

      - name: Missing path exits non-zero
        run: |
          set +e
          python video_dubber.py /nonexistent.mp4 --dry-run
          code=$?
          set -e
          test "$code" -ne 0

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: sarvam-video-dubber:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image (--help)
        run: docker run --rm sarvam-video-dubber:ci --help
