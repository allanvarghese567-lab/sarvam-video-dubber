target-version = "py310"
line-length = 100

[lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",   # long lines common in CLI help / prints
  "B008",   # function calls in defaults (argparse patterns)
]

[lint.per-file-ignores]
# Keep existing style; tighten later if desired
"video_dubber.py" = ["I001", "UP"]
